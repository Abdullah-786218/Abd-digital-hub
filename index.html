<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah - Project</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Loader Screen */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .logo-loader-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Green and Blue Animated Spinner Ring */
        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid transparent;
            border-top: 6px solid #00ffcc; /* Cyan / Green */
            border-right: 6px solid #0066ff; /* Deep Blue */
            border-bottom: 6px solid #00ffcc;
            animation: spin 1.2s linear infinite;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Main Content */
        #main-content {
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
            transition: opacity 0.8s ease;
        }

        #main-content.visible {
            opacity: 1;
        }

        .header-name {
            font-weight: bold;
            font-size: 2rem;
            margin-top: 25px;
            text-align: center;
            width: 100%;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .main-text {
            font-style: italic;
            font-weight: bold;
            font-size: 2.5rem;
            margin: 25px 0 35px 0;
            text-align: center;
        }

        .section-box {
            border: 2px solid #ffffff;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            width: 85%;
            max-width: 600px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.03);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
        }

        .box-title {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ffcc;
        }

        .content-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .content-item {
            margin: 12px 0;
            font-size: 1.1rem;
            color: #cccccc;
        }

        .content-item a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
        }

        .content-item a:hover {
            color: #00ffcc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Loading Animation Screen -->
    <div id="loader-wrapper">
        <div class="logo-loader-container">
            <div class="spinner-ring"></div>
            <img src="https://i.ibb.co/L519p40/avatar-logo.jpg" alt="Abdullah Logo" class="logo-img">
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <div class="header-name">Abdullah</div>

        <div class="main-text">
            Welcome to My Project
        </div>

        <!-- Apps Section -->
        <div class="section-box" id="apps-box">
            <div class="box-title">Apps</div>
            <ul class="content-list">
                <li class="content-item">App 1 (Placeholder)</li>
                <li class="content-item">App 2 (Placeholder)</li>
            </ul>
        </div>

        <!-- Links Section -->
        <div class="section-box" id="links-box">
            <div class="box-title">Links</div>
            <ul class="content-list">
                <li class="content-item"><a href="#">Link 1</a></li>
                <li class="content-item"><a href="#">Link 2</a></li>
            </ul>
        </div>

        <!-- Groups Section -->
        <div class="section-box" id="groups-box">
            <div class="box-title">Groups</div>
            <ul class="content-list">
                <li class="content-item">Group 1 (Placeholder)</li>
                <li class="content-item">Group 2 (Placeholder)</li>
            </ul>
        </div>
    </div>

    <script>
        // Shows the website content after 2.5 seconds of loading
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader-wrapper');
                const mainContent = document.getElementById('main-content');
                
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                mainContent.classList.add('visible');
            }, 2500);
        });
    </script>
</body>
</html>
